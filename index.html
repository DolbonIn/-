                content: `<div class="text-left max-w-4xl mx-auto slide-content">
                              <h2 class="text-4xl font-bold mb-4">핵심 인력</h2>
                              <div class="space-y-6">
                                  <div class="bg-gray-800/50 p-4 rounded-lg"><h3 class="text-xl font-bold text-indigo-300">고석현, CEO</h3><p class="text-gray-400 mt-1">전 Company.AI 공동창업자 (네이버 EXIT), 전 네이버 AI SaaS 리드, 전 토스 검색 플랫폼/데이터 시스템 총괄.</p></div>
                                  <div class="bg-gray-800/50 p-4 rounded-lg"><h3 class="text-xl font-bold text-indigo-300">박우명, CDO</h3><p class="text-gray-400 mt-1">UMD 박사, 전 삼성리서치, 전 네이버 AI 리서치 리더, 네이버 '하이퍼클로바' 모델 개발 및 연구 총괄.</p></div>
                                  <div class="bg-gray-800/50 p-4 rounded-lg"><h3 class="text-xl font-bold text-indigo-300">한시형, CSO</h3><p class="text-gray-400 mt-1">NYU 졸업, 전 IBM 시니어 컨설턴트, 전 네이버 클로바 AI 비즈니스 팀 리더, 네이버/라인 AI 사업 전략 담당.</p></div>
                              </div>
                          </div>`
            },
            {
                title: "부록: 용어 설명",
                header: "Appendix: Glossary",
                content: `<div class="text-left max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-4 slide-content">
                              <div class="bg-gray-800/50 p-4 rounded-lg"><strong class="text-indigo-300">ARR (Annual Recurring Revenue):</strong> 연간 반복 매출. 비즈니스의 예측 가능한 수익성을 나타내는 핵심 SaaS 지표.</div>
                              <div class="bg-gray-800/50 p-4 rounded-lg"><strong class="text-indigo-300">NRR (Net Revenue Retention):</strong> 순매출 유지율. 기존 고객의 확장, 축소, 이탈을 모두 고려한 매출 성장률. 100% 이상은 건강한 성장을 의미.</div>
                              <div class="bg-gray-800/50 p-4 rounded-lg"><strong class="text-indigo-300">LTV (Lifetime Value):</strong> 고객 생애 가치. 한 고객이 서비스 기간 동안 창출할 총 수익.</div>
                              <div class="bg-gray-800/50 p-4 rounded-lg"><strong class="text-indigo-300">CAC (Customer Acquisition Cost):</strong> 고객 획득 비용. 신규 고객 한 명을 유치하는 데 드는 총 비용.</div>
                              <div class="bg-gray-800/50 p-4 rounded-lg"><strong class="text-indigo-300">GTM (Go-to-Market):</strong> 시장 진출 전략. 제품을 고객에게 전달하고 경쟁 우위를 확보하기 위한 계획.</div>
                              <div class="bg-gray-800/50 p-4 rounded-lg"><strong class="text-indigo-300">OS (Operating System):</strong> 운영체제. 특정 도메인의 모든 애플리케이션과 워크플로우를 구동하는 핵심 기반 플랫폼.</div>
                          </div>`
            }
        ];

        let currentSlide = 0;
        const slideContainer = document.getElementById('slide-container');
        const slideCounter = document.getElementById('slide-counter');
        const slideTitle = document.getElementById('slide-title');
        const progressBar = document.getElementById('progress-bar');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function createSlides() {
            slidesData.forEach((slideData, index) => {
                const slideEl = document.createElement('div');
                slideEl.id = `slide-${index}`;
                slideEl.className = 'slide p-8 md:p-16';
                
                let headerContent = '';
                if (slideData.header) {
                     headerContent = `<div class="absolute top-0 left-0 w-full p-4 text-left text-gray-500 text-sm tracking-widest uppercase">${slideData.header}</div>`;
                }

                slideEl.innerHTML = `
                    ${headerContent}
                    <div class="w-full max-w-7xl">
                        ${slideData.content}
                    </div>
                `;
                slideContainer.appendChild(slideEl);
            });
        }
        
        function updateSlideView() {
            const slides = document.querySelectorAll('.slide');
            
            slides.forEach((slide, index) => {
                if (index === currentSlide) {
                    slide.classList.add('active');
                } else {
                    slide.classList.remove('active');
                }
            });

            slideCounter.textContent = `${currentSlide + 1} / ${slidesData.length}`;
            slideTitle.textContent = slidesData[currentSlide].title;
            progressBar.style.width = `${((currentSlide + 1) / slidesData.length) * 100}%`;

            prevBtn.disabled = currentSlide === 0;
            nextBtn.disabled = currentSlide === slidesData.length - 1;
        }

        function goToSlide(slideNumber) {
            if (slideNumber >= 0 && slideNumber < slidesData.length) {
                const targetSlide = document.getElementById(`slide-${slideNumber}`);
                if (targetSlide) {
                    slideContainer.scrollTo({
                        left: targetSlide.offsetLeft,
                        behavior: 'smooth'
                    });
                    // The IntersectionObserver will handle the rest
                }
            }
        }

        prevBtn.addEventListener('click', () => goToSlide(currentSlide - 1));
        nextBtn.addEventListener('click', () => goToSlide(currentSlide + 1));

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentSlide < slidesData.length - 1) {
                e.preventDefault();
                goToSlide(currentSlide + 1);
            } else if (e.key === 'ArrowLeft' && currentSlide > 0) {
                e.preventDefault();
                goToSlide(currentSlide - 1);
            }
        });
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const slideIndex = parseInt(entry.target.id.split('-')[1]);
                    currentSlide = slideIndex;
                    updateSlideView();
                }
            });
        }, { threshold: 0.6 });

        createSlides();
        document.querySelectorAll('.slide').forEach(slide => {
            observer.observe(slide);
        });

        setTimeout(() => {
            document.getElementById('slide-0')?.classList.add('active');
            updateSlideView();
        }, 100);
    </script>
</body>
</html>
